<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/layout :: view('employee', ~{::title}, ~{::article})}">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý nhập kho</title>
</head>
<body>
<article>

  <div class="card p-4" style="border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.06)">
    <h3 class="text-center mb-3" style="font-weight:700">
      <i class="bi bi-box-seam me-2"></i> Quản lý nhập kho
    </h3>

    <ul class="nav nav-tabs" id="nhapKhoTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="nhapkho-tab" data-bs-toggle="tab"
                data-bs-target="#nhapkho" type="button" role="tab"
                aria-controls="nhapkho" aria-selected="true">
          <i class="bi bi-plus-circle me-2"></i>Nhập kho
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="lichsu-tab" data-bs-toggle="tab"
                data-bs-target="#lichsu" type="button" role="tab"
                aria-controls="lichsu" aria-selected="false">
          <i class="bi bi-clock-history me-2"></i>Lịch sử nhập kho
        </button>
      </li>
    </ul>

    <div class="tab-content" id="nhapKhoTabContent">
      <div class="tab-pane fade show active" id="nhapkho" role="tabpanel" aria-labelledby="nhapkho-tab">

        <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

        <!-- Form trên cùng -->
        <form th:action="@{/employee/import/row}" method="post" class="row g-3 align-items-end mt-3">
          <div class="col-md-6">
            <label class="form-label"><i class="bi bi-box me-1"></i> Sản phẩm</label>
            <select name="maSP" class="form-select" required>
              <option value="">-- Chọn sản phẩm --</option>
              <option th:each="sp : ${sanPhams}"
                      th:value="${sp.maSP}"
                      th:text="${sp.tenSP + ' (SL tồn: ' + (sp.soLuong==null?0:sp.soLuong) + ')'}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label"><i class="bi bi-123 me-1"></i> Số lượng</label>
            <input type="number" name="soLuong" min="1" class="form-control" placeholder="Nhập số lượng" required>
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn" style="background:linear-gradient(135deg,#10b981,#059669); color:#fff;">
              <i class="bi bi-check-circle me-2"></i>Nhập
            </button>
          </div>
        </form>

        <!-- Bảng sản phẩm (không thay đổi layout tổng thể) -->
        <div class="mt-4">
          <h5 class="mb-3" style="font-weight:700">Danh sách sản phẩm</h5>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead style="background:linear-gradient(135deg,#667eea 0%, #764ba2 100%); color:#fff;">
              <tr>
                <th>Hình</th>
                <th>Mã SP</th>
                <th>Tên sản phẩm</th>
                <th class="text-end">SL tồn</th>
                <th style="width:220px;">Nhập kho</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${#lists.isEmpty(sanPhams)}">
                <td colspan="5" class="text-center text-muted py-4">Chưa có sản phẩm nào.</td>
              </tr>

              <tr th:each="sp : ${sanPhams}">
                <td>
                  <img th:src="@{/images/{h}(h=${sp.hinh})}" alt=""
                       style="width:48px;height:48px;object-fit:cover;border-radius:8px;"
                       onerror="this.src='/images/no-image.png'">
                </td>
                <td th:text="${sp.maSP}"></td>
                <td th:text="${sp.tenSP}"></td>
                <td class="text-end" th:text="${sp.soLuong==null?0:sp.soLuong}"></td>

                <!-- nhập nhanh mỗi dòng -->
                <td>
                  <form th:action="@{/employee/import/row}" method="post" class="d-flex gap-2">
                    <input type="hidden" name="maSP" th:value="${sp.maSP}">
                    <input type="number" name="soLuong" min="1" class="form-control" placeholder="SL" required>
                    <button class="btn btn-sm" style="background:linear-gradient(135deg,#10b981,#059669); color:#fff;">
                      Nhập
                    </button>
                  </form>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- Tab lịch sử: HIỂN THỊ DỮ LIỆU (giữ nguyên tone màu) -->
      <div class="tab-pane fade" id="lichsu" role="tabpanel" aria-labelledby="lichsu-tab">
        <div class="mt-3">
          <h5 class="mb-3" style="font-weight:700">Lịch sử nhập kho (mới nhất trước)</h5>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead style="background:linear-gradient(135deg,#667eea 0%, #764ba2 100%); color:#fff;">
              <tr>
                <th>Mã NK</th>
                <th>Mã SP</th>
                <th>Tên sản phẩm</th>
                <th class="text-end">Số lượng</th>
                <th>Ngày nhập</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${#lists.isEmpty(listNK)}">
                <td colspan="5" class="text-center text-muted py-4">Chưa có lịch sử nhập kho.</td>
              </tr>

              <tr th:each="nk : ${listNK}">
                <td th:text="${nk.maNK}"></td>
                <td th:text="${nk.sanPham != null ? nk.sanPham.maSP : ''}"></td>
                <td th:text="${nk.sanPham != null ? nk.sanPham.tenSP : ''}"></td>
                <td class="text-end" th:text="${nk.soLuong}"></td>
                <!-- Nếu NgayNK là LocalDateTime: dùng #temporals; nếu là java.util.Date: đổi sang #dates -->
                <td th:text="${#temporals.format(nk.ngayNK, 'dd/MM/yyyy HH:mm')}"></td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- /Tab lịch sử -->

    </div>
  </div>

  <style>
    .table thead th { border:0; }
    .table tbody tr:hover { background:#fafafa; }
  </style>

</article>
</body>
</html>
