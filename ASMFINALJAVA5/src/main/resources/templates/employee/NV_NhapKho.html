<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/layout :: view('employee', ~{::title}, ~{::article})}">
<head>
    <meta charset="UTF-8">
    <title>Nhập Kho</title>
</head>

<body>
<article>
    <!-- giữ nguyên CSS của bạn -->
    <style>
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f7f7f9; min-height:100vh; padding:20px; }
        .card { border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.08); border:none; }
        .card h3 { color:#1e293b; font-weight:600; margin-bottom:25px; }
        .nav-tabs { border-bottom:2px solid #dee2e6; }
        .nav-tabs .nav-link { color:#666; font-weight:500; border:none; border-bottom:3px solid transparent; padding:12px 24px; transition:.3s; }
        .nav-tabs .nav-link:hover { color:#4f46e5; border-color:transparent; }
        .nav-tabs .nav-link.active { color:#4f46e5; background:transparent; border-color:#4f46e5; }
        .tab-content { padding:25px; }
        .form-label { font-weight:500; color:#333; margin-bottom:8px; }
        .form-select,.form-control { border:2px solid #e2e8f0; border-radius:10px; padding:10px 15px; transition:.3s; }
        .form-select:focus,.form-control:focus { border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,.1); }
        .btn-success { background:linear-gradient(135deg,#10b981,#059669); border:none; padding:10px 25px; border-radius:10px; font-weight:500; transition:.3s; }
        .btn-success:hover { transform:translateY(-2px); box-shadow:0 5px 15px rgba(16,185,129,.4); }
        .table { margin-top:20px; }
        .table thead { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; }
        .table thead th { border:none; padding:15px; font-weight:600; }
        .table tbody tr { transition:.3s; }
        .table tbody tr:hover { background:#f8fafc; transform:scale(1.01); }
        .table tbody td { padding:15px; vertical-align:middle; }
        .table-striped tbody tr:nth-of-type(odd){ background-color:rgba(0,0,0,.02); }
        .page-container { padding:30px; background:#f7f7f9; min-height:100vh; }
        @media (max-width:768px){ .import-container{ padding:15px; } .form-select,.form-control{ min-width:100%; } }
    </style>

    <div class="page-container">
        <div class="card p-4">
            <h3 class="text-center">
                <i class="bi bi-box-seam me-2"></i>
                Quản lý nhập kho
            </h3>

            <!-- Flash message -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

            <ul class="nav nav-tabs" id="nhapKhoTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="nhapkho-tab" data-bs-toggle="tab"
                            data-bs-target="#nhapkho" type="button" role="tab"
                            aria-controls="nhapkho" aria-selected="true">
                        <i class="bi bi-plus-circle me-2"></i>Nhập kho
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="lichsu-tab" data-bs-toggle="tab"
                            data-bs-target="#lichsu" type="button" role="tab"
                            aria-controls="lichsu" aria-selected="false">
                        <i class="bi bi-clock-history me-2"></i>Lịch sử nhập kho
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="nhapKhoTabContent">
                <!-- Tab Nhập Kho -->
                <div class="tab-pane fade show active" id="nhapkho" role="tabpanel" aria-labelledby="nhapkho-tab">
                    <!-- Form submit lên server -->
                    <form id="form-nhapkho" class="row g-3 align-items-end"
                          th:action="@{/employee/import/row}" method="post">
                        <div class="col-md-6">
                            <label for="sp" class="form-label">
                                <i class="bi bi-box me-1"></i>Sản phẩm
                            </label>
                            <select id="sp" class="form-select" required name="maSP">
                                <option value="">-- Chọn sản phẩm --</option>
                                <option th:each="sp : ${sanPhams}"
                                        th:value="${sp.maSP}"
                                        th:text="${sp.maSP + ' - ' + sp.tenSP}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="soluong" class="form-label">
                                <i class="bi bi-123 me-1"></i>Số lượng
                            </label>
                            <input type="number" min="1" class="form-control" id="soluong"
                                   placeholder="Nhập số lượng" required name="soLuong">
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-2"></i>Nhập
                            </button>
                        </div>
                    </form>

                    <!-- ===== BẢNG NHẬP KHO (mới thêm, chức năng nhập nhanh từng dòng) ===== -->
                    <div class="table-responsive">
                        <table class="table table-bordered mt-4">
                            <thead class="table-dark">
                                <tr>
                                    <th>Hình</th>
                                    
                                    <th>Tên sản phẩm</th>
                                    <th class="text-end">SL tồn</th>
                                    <th style="width:280px">Nhập kho</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(sanPhams)}">
                                    <td colspan="5" class="text-center text-muted py-4">Chưa có sản phẩm nào.</td>
                                </tr>

                                <tr th:each="sp : ${sanPhams}">
                                    <td style="width:72px">
                                        <img th:src="@{/images/{h}(h=${sp.hinh})}" alt=""
                                             style="width:48px;height:48px;object-fit:cover;border-radius:8px;"
                                             onerror="this.src='/images/no-image.png'">
                                    </td>
                                    
                                    <td th:text="${sp.tenSP}">Tên sản phẩm</td>
                                    <td class="text-end" th:text="${sp.soLuong==null?0:sp.soLuong}">0</td>
                                    <td>
                                        <form th:action="@{/employee/import/row}" method="post" class="d-flex align-items-center gap-2">
                                            <input type="hidden" name="maSP" th:value="${sp.maSP}">
                                            <div class="input-group input-group-sm" style="max-width:170px">
                                                <span class="input-group-text">SL</span>
                                                <input type="number" name="soLuong" class="form-control" min="1" required>
                                            </div>
                                            <button class="btn btn-sm btn-success">Nhập</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- ===== /BẢNG NHẬP KHO ===== -->
                </div>

                <!-- Tab Lịch Sử -->
                <div class="tab-pane fade" id="lichsu" role="tabpanel" aria-labelledby="lichsu-tab">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th><i class="bi bi-hash me-2"></i>Mã nhập kho</th>
                                    
                                    <th><i class="bi bi-box-seam me-2"></i>Tên sản phẩm</th>
                                    <th><i class="bi bi-123 me-2"></i>Số lượng</th>
                                    <th><i class="bi bi-calendar-event me-2"></i>Ngày nhập</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(listNK)}">
                                    <td colspan="5" class="text-center text-muted py-4">Chưa có lịch sử nhập kho.</td>
                                </tr>
                                <tr th:each="nk : ${listNK}">
                                    <td th:text="${nk.maNK}"></td>
                                    
                                    <td th:text="${nk.sanPham != null ? nk.sanPham.tenSP : ''}"></td>
                                    <td th:text="${nk.soLuong}"></td>
                                    <td th:text="${#temporals.format(nk.ngayNK,'dd/MM/yyyy HH:mm')}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div><!-- /tab-content -->
        </div>
    </div>
</article>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Không ngăn submit; để server xử lý -->
<script>
  document.getElementById('form-nhapkho')?.addEventListener('submit', function(){});
</script>
</body>
</html>
