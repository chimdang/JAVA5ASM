<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: view('customer', ~{::title}, ~{::article})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pine Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body>
    <article>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #fff;
                min-height: 100vh;
            }

            /* Categories */
            .categories {
                background: rgba(255, 255, 255, 0.98);
                padding: 35px 25px 40px 25px;
                border-radius: 16px;
                margin-top: 30px;
                box-shadow: 0 4px 24px rgba(67, 160, 71, 0.13), 0 0 0 4px #ffe06633;
                border: 2px solid #ffe066;
            }

            .category-item {
                text-align: center;
                cursor: pointer;
                padding: 18px 0 0 0;
                transition: transform 0.25s, box-shadow 0.25s;
                border-radius: 12px;
                background: transparent;
                box-shadow: 0 2px 8px rgba(67, 160, 71, 0.07);
                position: relative;
            }

            .category-item:hover {
                transform: translateY(-8px) scale(1.10);
                box-shadow: 0 8px 24px #ffe06655, 0 2px 8px rgba(67, 160, 71, 0.13);
                background: #fffbe6;
                z-index: 2;
            }

            .category-item.active {
                background: linear-gradient(135deg, #ffe066ee 70%, #43a047 100%);
                transform: translateY(-8px) scale(1.10);
                box-shadow: 0 8px 24px #ffe06655, 0 2px 8px rgba(67, 160, 71, 0.13);
            }

            .category-icon {
                width: 64px;
                height: 64px;
                margin: 0 auto 12px;
                background: linear-gradient(135deg, #ffe066ee 70%, #43a047 100%);
                border-radius: 20%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 32px;
                color: var(--pine-dark);
                box-shadow: 0 4px 16px #ffe06655, 0 2px 8px rgba(67, 160, 71, 0.13);
                border: 2px solid #ffd700;
                transition: background 0.2s, box-shadow 0.2s, color 0.2s;
            }

            .category-item:hover .category-icon,
            .category-item.active .category-icon {
                background: linear-gradient(135deg, #ffd700 50%, #3bb143 100%);
                color: #fff;
                box-shadow: 0 8px 32px #a8ddab99;
                border: 2px solid #43a047;
            }

            .category-name {
                font-size: 15px;
                color: var(--pine-green);
                font-weight: 600;
                letter-spacing: 1px;
                margin-top: 2px;
                text-shadow: 0 2px 8px #ffe06633;
            }

            .category-item.active .category-name {
                color: #fff;
                font-weight: 700;
            }

            /* Product Card */
            .product-card {
                background: rgba(255, 255, 255, 0.98);
                border: 1px solid var(--pine-primary);
                border-radius: 8px;
                cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s;
                margin-bottom: 15px;
                box-shadow: 0 2px 8px rgba(255, 224, 102, 0.08);
            }

            .product-card:hover {
                transform: translateY(-2px) scale(1.03);
                box-shadow: 0 4px 16px rgba(67, 160, 71, 0.13);
            }

            .product-image {
                width: 100%;
                height: 200px;
                overflow: hidden;
                position: relative;
                border-radius: 8px 8px 0 0;
            }

            .product-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.3s;
            }

            .product-card:hover .product-image img {
                transform: scale(1.07);
            }

            .product-badge {
                position: absolute;
                top: 5px;
                left: 5px;
                background: var(--pine-green);
                color: var(--pine-primary);
                padding: 3px 8px;
                font-size: 12px;
                border-radius: 4px;
                font-weight: bold;
                box-shadow: 0 2px 8px rgba(67, 160, 71, 0.08);
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 15px;
                color: var(--pine-dark);
                height: 40px;
                overflow: hidden;
                margin-bottom: 8px;
                font-weight: 500;
            }

            .price-current {
                color: var(--pine-green);
                font-size: 16px;
                font-weight: 600;
            }

            .product-sold {
                font-size: 12px;
                color: var(--pine-dark);
                margin-top: 8px;
            }

            /* Section Title */
            .section-title {
                font-size: 26px;
                color: var(--pine-green);
                font-weight: bold;
                text-align: center;
                margin-bottom: 32px;
                text-transform: uppercase;
                letter-spacing: 2px;
                border-bottom: 2px solid #ffe066;
                display: inline-block;
                padding-bottom: 6px;
            }

            /* Flash Sale Section */
            .flash-sale {
                background: rgba(255, 255, 255, 0.97);
                padding: 25px;
                border-radius: 8px;
                margin-top: 20px;
                box-shadow: 0 2px 12px rgba(255, 224, 102, 0.09);
            }

            /* Loading */
            .loading-container {
                text-align: center;
                padding: 60px 20px;
            }

            .loading-spinner {
                display: inline-block;
                width: 50px;
                height: 50px;
                border: 4px solid #ffe06633;
                border-top-color: var(--pine-green);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            /* Empty State */
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: var(--pine-dark);
            }

            .empty-state i {
                font-size: 80px;
                color: var(--pine-primary);
                margin-bottom: 20px;
            }

            /* Back Button */
            .back-button {
                background: var(--pine-green);
                color: #fff;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                cursor: pointer;
                transition: background 0.2s;
                margin-bottom: 20px;
            }

            .back-button:hover {
                background: var(--pine-dark);
            }
        </style>
        
        <!-- Main Content -->
        <div class="container">
            <!-- Categories -->
            <div class="categories">
                <h2 class="section-title">Danh Mục</h2>
                <div class="row g-2" id="categoryList">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <p class="mt-3 text-muted">Đang tải danh mục...</p>
                    </div>
                </div>
            </div>

            <!-- Products Section -->
            <div class="flash-sale" id="productsSection">
                <!-- Nút quay lại (ẩn mặc định) -->
                <button class="back-button" id="backButton" style="display: none;" onclick="showAllProducts()">
                    <i class="bi bi-arrow-left"></i> Quay lại tất cả sản phẩm
                </button>
                
                <h2 class="section-title" id="productsSectionTitle">Tất Cả Sản Phẩm</h2>
                
                <div class="row g-3" id="productsList">
                    <!-- Sản phẩm sẽ được load ở đây -->
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <p class="mt-3 text-muted">Đang tải sản phẩm...</p>
                    </div>
                </div>
            </div>
        </div>
    </article>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Icon mapping cho các danh mục
        const categoryIcons = {
            'Điện thoại': 'bi-phone',
            'Máy tính bảng': 'bi-tablet',
            'Laptop': 'bi-laptop',
            'Tai nghe': 'bi-headphones',
            'Phụ kiện': 'bi-plug',
            'Đồng hồ': 'bi-watch',
            'Thiết bị nhà thông minh': 'bi-house-gear',
            'Màn hình': 'bi-display',
            'Chuột & Bàn phím': 'bi-keyboard',
            'Thiết bị mạng': 'bi-router'
        };

        let allCategories = [];
        let currentCategoryId = null;

        // Load khi trang load
        document.addEventListener('DOMContentLoaded', function() {
            loadCategories();
            loadAllProducts();
        });

        // Hàm load danh sách danh mục
        function loadCategories() {
            fetch('/customer/categories')
                .then(response => response.json())
                .then(categories => {
                    allCategories = categories;
                    const categoryList = document.getElementById('categoryList');
                    categoryList.innerHTML = '';
                    
                    if (categories.length === 0) {
                        categoryList.innerHTML = `
                            <div class="col-12">
                                <div class="empty-state">
                                    <i class="bi bi-inbox"></i>
                                    <h4>Chưa có danh mục nào!</h4>
                                </div>
                            </div>
                        `;
                        return;
                    }
                    
                    categories.forEach(category => {
                        const icon = categoryIcons[category.tenDM] || 'bi-box-seam';
                        const categoryCard = `
                            <div class="col-6 col-md-4 col-lg-2">
                                <div class="category-item" data-category-id="${category.maDM}" 
                                     onclick="showCategoryProducts(${category.maDM}, '${category.tenDM}')">
                                    <div class="category-icon">
                                        <i class="bi ${icon}"></i>
                                    </div>
                                    <div class="category-name">${category.tenDM}</div>
                                </div>
                            </div>
                        `;
                        categoryList.innerHTML += categoryCard;
                    });
                })
                .catch(error => {
                    console.error('Error loading categories:', error);
                    document.getElementById('categoryList').innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <i class="bi bi-exclamation-triangle"></i>
                                <h4>Không thể tải danh mục!</h4>
                                <p>${error.message}</p>
                            </div>
                        </div>
                    `;
                });
        }

        // Hàm load tất cả sản phẩm
        function loadAllProducts() {
            currentCategoryId = null;
            document.getElementById('backButton').style.display = 'none';
            document.getElementById('productsSectionTitle').textContent = 'Tất Cả Sản Phẩm';
            
            // Xóa active class từ tất cả category
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="mt-3 text-muted">Đang tải sản phẩm...</p>
                </div>
            `;
            
            // Giả sử bạn có endpoint để lấy tất cả sản phẩm
            // Hoặc có thể load từ server-side render
            fetch('/customer/products/all')
                .then(response => response.json())
                .then(products => {
                    renderProducts(products);
                })
                .catch(error => {
                    console.error('Error loading all products:', error);
                    // Fallback: hiển thị sản phẩm từ Thymeleaf nếu có
                    productsList.innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <i class="bi bi-exclamation-triangle"></i>
                                <h4>Không thể tải sản phẩm!</h4>
                            </div>
                        </div>
                    `;
                });
        }

        // Hàm hiển thị sản phẩm theo danh mục
        function showCategoryProducts(maDM, tenDM) {
            currentCategoryId = maDM;
            document.getElementById('backButton').style.display = 'inline-block';
            document.getElementById('productsSectionTitle').textContent = `Sản phẩm: ${tenDM}`;
            
            // Thêm active class cho category được chọn
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-category-id="${maDM}"]`).classList.add('active');
            
            // Scroll đến phần sản phẩm
            document.getElementById('productsSection').scrollIntoView({ behavior: 'smooth' });
            
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="mt-3 text-muted">Đang tải sản phẩm...</p>
                </div>
            `;
            
            fetch(`/customer/products/by-category/${maDM}`)
                .then(response => response.json())
                .then(products => {
                    renderProducts(products);
                })
                .catch(error => {
                    console.error('Error loading products:', error);
                    productsList.innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <i class="bi bi-exclamation-triangle"></i>
                                <h4>Không thể tải sản phẩm!</h4>
                            </div>
                        </div>
                    `;
                });
        }

        // Hàm render sản phẩm
        function renderProducts(products) {
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = '';
            
            if (products.length === 0) {
                productsList.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <h4>Không có sản phẩm nào!</h4>
                            <p>Danh mục này chưa có sản phẩm.</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            products.forEach(product => {
                const productCard = `
                    <div class="col-6 col-md-4 col-lg-2">
                        <div class="product-card">
                            <div class="product-image">
                                <a href="/customer/detailProduct?maSP=${product.maSP}">
                                    <img src="/images/${product.hinh}" 
                                         alt="${product.tenSP}"
                                         onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop'">
                                </a>
                                ${product.phanLoai ? `<span class="product-badge">${product.phanLoai}</span>` : ''}
                            </div>
                            <div class="product-info">
                                <div class="product-name">${product.tenSP}</div>
                                <div>
                                    <span class="price-current">${formatPrice(product.donGia)}₫</span>
                                </div>
                                <div class="product-sold">
                                    Kho: <span>${product.soLuong}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                productsList.innerHTML += productCard;
            });
        }

        // Hàm format giá
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price);
        }

        // Hàm hiển thị tất cả sản phẩm (khi nhấn nút quay lại)
        function showAllProducts() {
            loadAllProducts();
            // Scroll về đầu trang sản phẩm
            document.getElementById('productsSection').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>

</html>
