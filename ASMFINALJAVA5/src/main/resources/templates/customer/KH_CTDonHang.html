<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: view('customer', ~{::title}, ~{::article})}">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng</title>
</head>
<body>
<article>
    <div class="container my-5">
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <div th:if="${order}">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Chi Tiết Đơn Hàng #<span th:text="${order.maHD}">9</span></h2>
                <a th:href="@{/customer/orders}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Quay Lại
                </a>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Thông Tin Đơn Hàng</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Ngày đặt hàng:</strong> <span th:text="${#dates.format(order.ngayMua, 'dd/MM/yyyy')}">19/10/2025</span></p>
                            <p><strong>Trạng thái:</strong>
                                <span th:text="${order.trangThai}" class="fw-bold"
                                      th:classappend="${order.trangThai == 'Đã nhận' ? 'text-success' : 
                                                       (order.trangThai == 'Đang giao' ? 'text-primary' : 
                                                       (order.trangThai == 'Chờ duyệt' ? 'text-warning' : 'text-danger'))}">
                                    Đang giao
                                </span>
                            </p>
                        </div>
                        <div class="col-md-6">
						    <h6><strong>Địa chỉ giao hàng:</strong></h6>
						    <div th:if="${diaChi}" class="p-3 bg-light rounded">
						        <p class="mb-1"><strong>Người nhận:</strong> <span th:text="${diaChi.tenNN}"></span></p>
						        <p class="mb-1"><strong>Số điện thoại:</strong> <span th:text="${diaChi.sdt}"></span></p>
						        <p class="mb-0"><strong>Địa chỉ:</strong> <span th:text="${diaChi.diemGiao}"></span></p>
						    </div>
						    <div th:if="${diaChiError}" class="alert alert-warning" th:text="${diaChiError}"></div>
						</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Danh Sách Sản Phẩm</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" style="width: 55%;">Sản phẩm</th>
                                <th scope="col" class="text-center">Số lượng</th>
                                <th scope="col" class="text-end">Đơn giá</th>
                                <th scope="col" class="text-end">Thành tiền</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.hoaDonCTs}" class="align-middle">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img th:src="@{'/images/' + ${item.sanPham.hinh}}" alt="Hình sản phẩm" class="img-thumbnail me-3" style="width: 70px; height: 70px; object-fit: cover;">
                                        <div>
                                            <p class="mb-0 fw-bold" th:text="${item.sanPham.tenSP}">iPhone 15 Pro</p>
                                            <small class="text-muted" th:text="${item.sanPham.phanLoai}">Điện thoại</small>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center" th:text="${item.soLuong}">1</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(item.donGia, 0, 'COMMA', 0, 'POINT')} + '₫'">29.990.000₫</td>
                                <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(item.soLuong * item.donGia, 0, 'COMMA', 0, 'POINT')} + '₫'">29.990.000₫</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer d-flex justify-content-end align-items-center">
                     <h5 class="mb-0 me-3">Tổng Cộng:</h5>
                     <h4 class="mb-0 text-danger fw-bold" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'">118.940.000₫</h4>
                </div>
            </div>
        </div>
    </div>
</article>
</body>
</html>
