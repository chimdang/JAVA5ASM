<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: view('customer', ~{::title}, ~{::article})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của bạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body>
    <article>
        <style>
            /* (CSS của bạn giữ nguyên) */
        </style>
        <div class="container-fluid px-5">
            <h2 style="position: relative;" class="m-3">Đơn Hàng Của Bạn</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info text-center">
                Bạn chưa có đơn hàng nào.
            </div>

            <div th:each="order : ${orders}" class="card p-3 m-2">
                <div class="d-flex justify-content-between align-items-center">
                    <span th:if="${!#lists.isEmpty(order.hoaDonCTs)}">
                        <strong th:text="${order.hoaDonCTs[0].sanPham.tenSP}"></strong>
                        <small class="text-muted" th:if="${#lists.size(order.hoaDonCTs) > 1}" 
                               th:text="' và ' + (${#lists.size(order.hoaDonCTs)} - 1) + ' sản phẩm khác'">
                        </small>
                    </span>
                    
                    <span th:text="${order.trangThai}"
                          th:classappend="${order.trangThai == 'Đã nhận' ? 'text-success' : 
                                           (order.trangThai == 'Đang giao' ? 'text-primary' : 
                                           (order.trangThai == 'Chờ duyệt' ? 'text-warning' : 'text-danger'))}">
                    </span>
                </div>
                
                <hr class="my-2">
                
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">Thành Tiền</span>
                    <strong class="text-danger" 
                            th:with="totalPrice=${#aggregates.sum(order.hoaDonCTs.![soLuong * donGia])}"
                            th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'">
                    </strong>
                </div>
                
                <a th:href="@{/customer/order/detail/{maHD}(maHD=${order.maHD})}" class="btn btn-outline-warning ms-auto my-3">
                    Xem chi tiết
                </a>
            </div>
            
        </div>
    </article>
</body>

</html>
